# Balanced for 8 GB RAM Windows PCs: enough heap to avoid GC thrashing while preventing native OOM.
org.gradle.jvmargs=-Xmx1536m -Xms512m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=160m -XX:+UseG1GC -XX:HeapBaseMinAddress=2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=192m
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
