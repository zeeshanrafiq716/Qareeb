services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qareeb
    ports:
      - "5432:5432"
    volumes:
      - qareeb_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qareeb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/qareeb
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      EMBEDDED_POSTGRES: "false"
    volumes:
      - qareeb_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  qareeb_pg:
  qareeb_uploads:
